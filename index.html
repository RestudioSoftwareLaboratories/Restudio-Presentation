<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Restudio Presentation</title>
    <link rel="icon" href="https://i.postimg.cc/66MLbbg8/restudio-profile.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap"
        rel="stylesheet"
    >
    <link
        href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet"
    >
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js">
    </script>
    <!-- ✅ إصلاح أمني: CSP يمنع تنفيذ السكربتات غير المصرح بها -->
    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.postimg.cc https://api.qrserver.com; connect-src 'self' https://api.qrserver.com;"
    >
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-left">
            <img
                class="logo"
                src="https://i.postimg.cc/s2j0rzBZ/swrh-restudio.png"
                alt="ReStudio Logo"
            >
            <span class="brand-text">Presentation</span>
        </div>
        <button class="exit-focus-btn" id="exitFocusBtn">
            <span class="material-icons">close_fullscreen</span> Exit
        </button>
    </header>

    <div class="toolbar" id="toolbar">
        <div class="tool-group">
            <button class="tool-btn" data-action="newDoc">
                <span class="material-icons">note_add</span> New slide
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="undo">
                <span class="material-icons">undo</span>
            </button>
            <button class="tool-btn" data-action="redo">
                <span class="material-icons">redo</span>
            </button>
            <button class="tool-btn" data-action="deleteSelected">
                <span class="material-icons">delete</span> Delete
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="addText">
                <span class="material-icons">text_fields</span> Text
            </button>
            <button class="tool-btn" data-action="addImage">
                <span class="material-icons">image</span> Image
            </button>
            <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
            <button class="tool-btn" data-action="addRectangle">
                <span class="material-icons">crop_square</span> Rectangle
            </button>
            <button class="tool-btn" data-action="addCircle">
                <span class="material-icons">circle</span> Circle
            </button>
            <button class="tool-btn" data-action="addQR">
                <span class="material-icons">qr_code</span> QR
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="bold">
                <span class="material-icons">format_bold</span>
            </button>
            <button class="tool-btn" data-action="italic">
                <span class="material-icons">format_italic</span>
            </button>
            <button class="tool-btn" data-action="underline">
                <span class="material-icons">format_underlined</span>
            </button>
            <div class="dropdown-container" id="fontSizeContainer">
                <button class="tool-btn">
                    <span class="material-icons">format_size</span> Size
                </button>
                <div class="dropdown-content" id="fontSizeMenu">
                    <div class="dropdown-item" data-fontsize="12">12px</div>
                    <div class="dropdown-item" data-fontsize="18">18px</div>
                    <div class="dropdown-item" data-fontsize="24">24px</div>
                    <div class="dropdown-item" data-fontsize="32">32px</div>
                    <div class="dropdown-item" data-fontsize="48">48px</div>
                </div>
            </div>
            <button class="tool-btn" data-action="indentInc">
                <span class="material-icons">format_indent_increase</span>
            </button>
            <button class="tool-btn" data-action="indentDec">
                <span class="material-icons">format_indent_decrease</span>
            </button>
            <div class="dropdown-container" id="lineHeightContainer">
                <button class="tool-btn">
                    <span class="material-icons">format_line_spacing</span> Line H
                </button>
                <div class="dropdown-content" id="lineHeightMenu">
                    <div class="dropdown-item" data-lineheight="1">1.0</div>
                    <div class="dropdown-item" data-lineheight="1.5">1.5</div>
                    <div class="dropdown-item" data-lineheight="2">2.0</div>
                    <div class="dropdown-item" data-lineheight="2.5">2.5</div>
                    <div class="dropdown-item" data-lineheight="3">3.0</div>
                </div>
            </div>
            <div class="dropdown-container" id="textTransformContainer">
                <button class="tool-btn">
                    <span class="material-icons">text_fields</span> Aa
                </button>
                <div class="dropdown-content" id="textTransformMenu">
                    <div class="dropdown-item" data-transform="uppercase">UPPERCASE</div>
                    <div class="dropdown-item" data-transform="lowercase">lowercase</div>
                    <div class="dropdown-item" data-transform="capitalize">Capitalize Each Word</div>
                </div>
            </div>
        </div>
        <div class="tool-group">
            <div class="dropdown-container" id="fillColorContainer">
                <button class="tool-btn" id="fillColorBtn">
                    <span class="material-icons">format_color_text</span> Fill
                </button>
                <div class="color-picker-popup" id="fillColorPicker">
                    <div class="color-picker-grid" id="fillColorGrid"></div>
                    <label class="color-picker-label" for="fillColorCustom">Custom:</label>
                    <input type="color" class="color-picker-input" id="fillColorCustom" value="#ffffff">
                </div>
            </div>
            <div class="dropdown-container" id="bgColorContainer">
                <button class="tool-btn" id="bgColorBtn">
                    <span class="material-icons">format_color_fill</span> BG
                </button>
                <div class="color-picker-popup" id="bgColorPicker">
                    <div class="color-picker-grid" id="bgColorGrid"></div>
                    <label class="color-picker-label" for="bgColorCustom">Custom:</label>
                    <input type="color" class="color-picker-input" id="bgColorCustom" value="#3498db">
                </div>
            </div>
            <div class="dropdown-container" id="canvasBgContainer">
                <button class="tool-btn">
                    <span class="material-icons">palette</span> Page BG
                </button>
                <div class="color-picker-popup" id="canvasBgPicker">
                    <div class="color-picker-grid" id="canvasBgGrid"></div>
                    <label class="color-picker-label" for="canvasBgCustom">Custom:</label>
                    <input type="color" class="color-picker-input" id="canvasBgCustom" value="#2b2b2b">
                </div>
            </div>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="alignLeft">
                <span class="material-icons">format_align_left</span>
            </button>
            <button class="tool-btn" data-action="alignCenter">
                <span class="material-icons">format_align_center</span>
            </button>
            <button class="tool-btn" data-action="alignRight">
                <span class="material-icons">format_align_right</span>
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="bringForward">
                <span class="material-icons">arrow_upward</span> Forward
            </button>
            <button class="tool-btn" data-action="sendBackward">
                <span class="material-icons">arrow_downward</span> Backward
            </button>
            <button class="tool-btn" data-action="zoomIn">
                <span class="material-icons">zoom_in</span>
            </button>
            <span class="zoom-level" id="zoomLevelDisplay">100%</span>
            <button class="tool-btn" data-action="zoomOut">
                <span class="material-icons">zoom_out</span>
            </button>
            <button class="tool-btn" data-action="focusMode">
                <span class="material-icons">center_focus_strong</span> Focus
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="group">
                <span class="material-icons">group_work</span> Group
            </button>
            <button class="tool-btn" data-action="ungroup">
                <span class="material-icons">ungroup</span> Ungroup
            </button>
            <button class="tool-btn" id="effectBtn">
                <span class="material-icons">animation</span> Effect
            </button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="exportRept">
                <span class="material-icons">download</span> Export REPT
            </button>
            <button class="tool-btn" id="importJsonBtn">
                <span class="material-icons">upload</span> Import REPT
            </button>
            <button class="tool-btn" id="previewModeBtn">
                <span class="material-icons">slideshow</span> Preview Mode
            </button>
            <input type="file" id="importFileInput" accept=".rept,.restudio,.json" style="display:none;">
        </div>
    </div>

    <div class="app-main">
        <div class="slide-sidebar" id="slideSidebar">
            <div class="sidebar-header">
                <span>📑 SLIDES</span>
                <button class="add-slide-btn" id="addSlideBtn">+</button>
            </div>
            <div class="slides-list" id="slidesList"></div>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
            <div id="fabric-canvas-container"></div>
        </div>
    </div>

    <!-- Effect Modal -->
    <div id="effectModal" class="effect-modal">
        <div class="effect-panel">
            <h3>✨ Object Effect <button id="closeEffectModal">&times;</button></h3>
            <div class="field">
                <label for="effectSelect">Animation Effect</label>
                <select id="effectSelect">
                    <option value="fadeIn">Fade In</option>
                    <option value="slideInLeft">Slide In Left</option>
                    <option value="slideInRight">Slide In Right</option>
                    <option value="slideInUp">Slide In Up</option>
                    <option value="slideInDown">Slide In Down</option>
                    <option value="zoomIn">Zoom In</option>
                    <option value="bounce">Bounce (soft)</option>
                    <option value="flipX">Flip X</option>
                    <option value="flipY">Flip Y</option>
                    <option value="rotateIn">Rotate In</option>
                </select>
            </div>
            <div class="row-2col">
                <div class="field">
                    <label for="effectDuration">Duration (ms)</label>
                    <input type="number" id="effectDuration" value="800" min="100" step="50">
                </div>
                <div class="field">
                    <label for="effectDelay">Delay (ms)</label>
                    <input type="number" id="effectDelay" value="0" min="0" step="50">
                </div>
            </div>
            <div class="field">
                <label>Time period</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="timePeriod" value="onetime" checked> One time
                    </label>
                    <label>
                        <input type="radio" name="timePeriod" value="infinite"> Infinite (loop)
                    </label>
                </div>
            </div>
            <div class="field">
                <label for="effectEasing">Easing</label>
                <select id="effectEasing">
                    <option value="easeOutCubic">Smooth out</option>
                    <option value="easeOutBounce">Bouncy</option>
                    <option value="easeInOutQuad">Smooth</option>
                    <option value="linear">Linear</option>
                </select>
            </div>
            <button class="apply-effect-btn" id="applyEffectBtn">
                🎬 Apply to selected object
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
