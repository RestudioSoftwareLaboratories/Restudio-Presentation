<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- CSP - Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
        img-src 'self' data: https: blob:;
        connect-src 'self' https:;
        frame-src 'self' https:;
        object-src 'none';
    ">
    <title>Restudio Presentation</title>
    <link rel="icon" href="https://i.postimg.cc/66MLbbg8/restudio-profile.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
    <!-- Tabler Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
</head>
<body>
    <header class="top-bar">
        <div class="top-left">
            <img class="logo" src="https://i.postimg.cc/s2j0rzBZ/swrh-restudio.png" alt="ReStudio Logo">
            <span class="brand-text">Presentation</span>
        </div>
        <button class="exit-focus-btn" id="exitFocusBtn"><i class="ti ti-minimize"></i> Exit</button>
    </header>

    <div class="toolbar" id="toolbar">
        <div class="tool-group">
            <button class="tool-btn" data-action="newDoc"><i class="ti ti-file-plus"></i> New slide</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="undo"><i class="ti ti-arrow-back-up"></i></button>
            <button class="tool-btn" data-action="redo"><i class="ti ti-arrow-forward-up"></i></button>
            <button class="tool-btn" data-action="deleteSelected"><i class="ti ti-trash"></i> Delete</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="addText"><i class="ti ti-typography"></i> Text</button>
            <button class="tool-btn" data-action="addImage"><i class="ti ti-photo"></i> Image</button>
            <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
            <button class="tool-btn" data-action="addRectangle"><i class="ti ti-square"></i> Rectangle</button>
            <button class="tool-btn" data-action="addCircle"><i class="ti ti-circle"></i> Circle</button>
            <button class="tool-btn" data-action="addQR"><i class="ti ti-qrcode"></i> QR</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="bold"><i class="ti ti-bold"></i></button>
            <button class="tool-btn" data-action="italic"><i class="ti ti-italic"></i></button>
            <button class="tool-btn" data-action="underline"><i class="ti ti-underline"></i></button>
            <div class="dropdown-container" id="fontSizeContainer">
                <button class="tool-btn"><i class="ti ti-text-size"></i> Size</button>
                <div class="dropdown-content" id="fontSizeMenu">
                    <div class="dropdown-item" data-fontsize="12">12px <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-fontsize="18">18px <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-fontsize="24">24px <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-fontsize="32">32px <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-fontsize="48">48px <span class="check-icon ti ti-check" style="display:none;"></span></div>
                </div>
            </div>
            <button class="tool-btn" data-action="indentInc"><i class="ti ti-indent-increase"></i></button>
            <button class="tool-btn" data-action="indentDec"><i class="ti ti-indent-decrease"></i></button>
            <div class="dropdown-container" id="lineHeightContainer">
                <button class="tool-btn"><i class="ti ti-line-height"></i> Line H</button>
                <div class="dropdown-content" id="lineHeightMenu">
                    <div class="dropdown-item" data-lineheight="1">1.0 <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-lineheight="1.5">1.5 <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-lineheight="2">2.0 <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-lineheight="2.5">2.5 <span class="check-icon ti ti-check" style="display:none;"></span></div>
                    <div class="dropdown-item" data-lineheight="3">3.0 <span class="check-icon ti ti-check" style="display:none;"></span></div>
                </div>
            </div>
            <div class="dropdown-container" id="textTransformContainer">
                <button class="tool-btn"><i class="ti ti-text-case"></i> Aa</button>
                <div class="dropdown-content" id="textTransformMenu">
                    <div class="dropdown-item" data-transform="uppercase">UPPERCASE</div>
                    <div class="dropdown-item" data-transform="lowercase">lowercase</div>
                    <div class="dropdown-item" data-transform="capitalize">Capitalize Each Word</div>
                </div>
            </div>
        </div>
        <div class="tool-group">
            <div class="dropdown-container" id="fillColorContainer">
                <button class="tool-btn" id="fillColorBtn"><i class="ti ti-color-picker"></i> Fill</button>
                <div class="color-picker-popup" id="fillColorPicker">
                    <div class="color-picker-grid" id="fillColorGrid"></div>
                    <input type="color" class="color-picker-input" id="fillColorCustom" value="#ffffff">
                </div>
            </div>
            <div class="dropdown-container" id="bgColorContainer">
                <button class="tool-btn" id="bgColorBtn"><i class="ti ti-palette"></i> BG</button>
                <div class="color-picker-popup" id="bgColorPicker">
                    <div class="color-picker-grid" id="bgColorGrid"></div>
                    <input type="color" class="color-picker-input" id="bgColorCustom" value="#3498db">
                </div>
            </div>
            <div class="dropdown-container" id="canvasBgContainer">
                <button class="tool-btn"><i class="ti ti-brush"></i> Page BG</button>
                <div class="color-picker-popup" id="canvasBgPicker">
                    <div class="color-picker-grid" id="canvasBgGrid"></div>
                    <input type="color" class="color-picker-input" id="canvasBgCustom" value="#2b2b2b">
                </div>
            </div>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="alignLeft"><i class="ti ti-align-left"></i></button>
            <button class="tool-btn" data-action="alignCenter"><i class="ti ti-align-center"></i></button>
            <button class="tool-btn" data-action="alignRight"><i class="ti ti-align-right"></i></button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="bringForward"><i class="ti ti-arrow-up"></i> Forward</button>
            <button class="tool-btn" data-action="sendBackward"><i class="ti ti-arrow-down"></i> Backward</button>
            <button class="tool-btn" data-action="zoomIn"><i class="ti ti-zoom-in"></i></button>
            <span class="zoom-level" id="zoomLevelDisplay">100%</span>
            <button class="tool-btn" data-action="zoomOut"><i class="ti ti-zoom-out"></i></button>
            <button class="tool-btn" data-action="focusMode"><i class="ti ti-focus-2"></i> Focus</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="group"><i class="ti ti-group"></i> Group</button>
            <button class="tool-btn" data-action="ungroup"><i class="ti ti-ungroup"></i> Ungroup</button>
            <button class="tool-btn" id="effectBtn"><i class="ti ti-animation"></i> Effect</button>
        </div>
        <div class="tool-group">
            <button class="tool-btn" data-action="exportRept"><i class="ti ti-download"></i> Export REPT</button>
            <button class="tool-btn" id="importJsonBtn"><i class="ti ti-upload"></i> Import REPT</button>
            <button class="tool-btn" id="previewModeBtn"><i class="ti ti-presentation"></i> Preview Mode</button>
            <input type="file" id="importFileInput" accept=".rept,.restudio,.json" style="display:none;">
        </div>
    </div>

    <div class="app-main">
        <div class="slide-sidebar" id="slideSidebar">
            <div class="sidebar-header"><span>📑 SLIDES</span><button class="add-slide-btn" id="addSlideBtn">+</button></div>
            <div class="slides-list" id="slidesList"></div>
        </div>
        <div class="canvas-wrapper" id="canvasWrapper">
            <div id="fabric-canvas-container"></div>
        </div>
    </div>

    <!-- Effect Modal -->
    <div id="effectModal" class="effect-modal">
        <div class="effect-panel">
            <h3>✨ Object Effect <button id="closeEffectModal">&times;</button></h3>
            <div class="field">
                <label>Animation Effect</label>
                <select id="effectSelect">
                    <option value="fadeIn">Fade In</option>
                    <option value="slideInLeft">Slide In Left</option>
                    <option value="slideInRight">Slide In Right</option>
                    <option value="slideInUp">Slide In Up</option>
                    <option value="slideInDown">Slide In Down</option>
                    <option value="zoomIn">Zoom In</option>
                    <option value="bounce">Bounce (soft)</option>
                    <option value="flipX">Flip X</option>
                    <option value="flipY">Flip Y</option>
                    <option value="rotateIn">Rotate In</option>
                </select>
            </div>
            <div class="row-2col">
                <div class="field"><label>Duration (ms)</label><input type="number" id="effectDuration" value="800" min="100" step="50"></div>
                <div class="field"><label>Delay (ms)</label><input type="number" id="effectDelay" value="0" min="0" step="50"></div>
            </div>
            <div class="field">
                <label>Time period</label>
                <div class="radio-group">
                    <label><input type="radio" name="timePeriod" value="onetime" checked> One time</label>
                    <label><input type="radio" name="timePeriod" value="infinite"> Infinite (loop)</label>
                </div>
            </div>
            <div class="field"><label>Easing</label><select id="effectEasing"><option value="easeOutCubic">Smooth out</option><option value="easeOutBounce">Bouncy</option><option value="easeInOutQuad">Smooth</option><option value="linear">Linear</option></select></div>
            <button class="apply-effect-btn" id="applyEffectBtn">🎬 Apply to selected object</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
